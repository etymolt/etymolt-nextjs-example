name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate package.json parses
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
      - name: Validate next.config.mjs syntax
        run: node --check next.config.mjs
      - name: Install (tolerant -- @etymolt/sdk not yet published)
        id: install
        continue-on-error: true
        run: |
          if [ -f package-lock.json ]; then npm ci || npm install --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Typecheck (only if install succeeded)
        if: steps.install.outcome == 'success'
        run: npx --no-install tsc --noEmit
      - name: Lint (only if install succeeded)
        if: steps.install.outcome == 'success'
        run: npm run lint --if-present
      - name: Build (only if install succeeded)
        if: steps.install.outcome == 'success'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Note install skipped
        if: steps.install.outcome != 'success'
        run: |
          echo "::warning::npm install failed - @etymolt/sdk likely not yet on registry. Structural checks passed."
